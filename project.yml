name: YunfengHub
options:
  bundleIdPrefix: com.yunfeng
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: minimal   # 演示工程，避免并发检查报错卡住 CI
    DEVELOPMENT_TEAM: ""          # 有开发者账号时填 Team ID；用万能签可留空
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  YunfengHub:
    type: application
    platform: iOS
    sources:
      - path: YunfengHub
    # XcodeGen 会自动生成这个 Info.plist，改键值直接改这里
    info:
      path: YunfengHub/Info.plist
      properties:
        CFBundleDisplayName: yunfeng
        CFBundleName: yunfeng
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSLocalNetworkUsageDescription: 需要访问局域网内的 Home Assistant、NAS、Sun-Panel 等服务
        # 自建站点都是 http，不放开 ATS 会白屏
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        LSApplicationCategoryType: public.app-category.productivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yunfeng.hub
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: YunfengHub/YunfengHub.entitlements
        TARGETED_DEVICE_FAMILY: "1"
